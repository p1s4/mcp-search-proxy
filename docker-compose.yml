services:
  mcp-search-proxy:
    build: .
    image: mcp-search-proxy:1.0.1
    container_name: mcp-search-proxy
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "8092:8092"
    env_file:
      - .env
    environment:
      # Recommended: coupled url|token pairs (token optional after |).
      # Example: "https://opendata.cat/api/mcp,https://foo.bar/mcp|sk-abc123"
      # If UPSTREAMS is set, UPSTREAM_URLS/UPSTREAM_TOKENS are ignored.
      - UPSTREAMS=${UPSTREAMS:-}
      # Legacy: upstream MCP servers, comma-separated (Streamable HTTP).
      # First URL wins on tool-name collisions (fail-closed merge).
      - UPSTREAM_URLS=${UPSTREAM_URLS}
      # Legacy bearer tokens, positional against UPSTREAM_URLS (empty entry = no auth).
      # Example with 2 upstreams, second without auth: "sk-abc123,"
      - UPSTREAM_TOKENS=${UPSTREAM_TOKENS:-}
      - UPSTREAM_TIMEOUT_A11Y=280
      - MANIFEST_PATH=/app/data/manifest.json
      - PORT=8092
      # Reactive refresh only: no polling, no listChanged handling.
      # 1800 = safety-net TTL, 0 = explicit mcp_refresh / unknown-tool only.
      - CATALOG_TTL_SEC=1800
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data

networks:
  default:
    name: proxy-net
